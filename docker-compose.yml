services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_container
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecom
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    # Notice we DO NOT map ports (e.g., "3306:3306") here. 
    # This keeps the database hidden from the public internet for security.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  php_adminer:
    build:
      context: ./php
    container_name: php_adminer
    ports:
      - "8081:80"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - app-network

  springboot_app:
    build: . # Tells Compose to look for your Dockerfile in this directory
    container_name: springboot_container
    ports:
      - "8088:8088" # Maps port 8088 on your EC2 to port 8088 inside Spring Boot
    environment:
      # Spring connects using the container name 'mysql_db' instead of 'localhost'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/ecom?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - app-network

# This defines the persistent volume so your data isn't deleted
volumes:
  db_data:

# This network allows the containers to communicate securely by container name
networks:
  app-network: