version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    # Notice we DO NOT map ports (e.g., "3306:3306") here. 
    # This keeps the database hidden from the public internet for security.

  adminer:
    image: adminer
    container_name: adminer_container
    ports:
      - "8081:8080" # Maps port 8081 on your EC2 to port 8080 inside Adminer
    depends_on:
      - mysql_db
    networks:
      - app-network

  springboot_app:
    build: . # Tells Compose to look for your Dockerfile in this directory
    container_name: springboot_container
    ports:
      - "8080:8080" # Maps port 8080 on your EC2 to port 8080 inside Spring Boot
    environment:
      # Spring connects using the container name 'mysql_db' instead of 'localhost'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/ecom
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql_db
    networks:
      - app-network

# This defines the persistent volume so your data isn't deleted
volumes:
  db_data:

# This network allows the containers to communicate securely by container name
networks:
  app-network: